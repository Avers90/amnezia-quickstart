[defaults]
inventory = inventory/hosts.yml
roles_path = roles
vault_password_file = .vault_pass

stdout_callback = default
callback_result_format = yaml
callbacks_enabled = timer

forks = 10
timeout = 30

gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_cache

retry_files_enabled = false

[ssh_connection]
pipelining = true
# accept-new: trust the host key on first connect, refuse if it changes later.
# ServerAlive*: long silent tasks (WGDashboard build, ~5-10 min) must not
# drop the SSH session.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = true
become_method = sudo
become_user = root
