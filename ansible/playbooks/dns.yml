---
## Local DNS for VPN clients: AdGuard Home on the tunnel IP. make dns HOST=<host>
- name: AdGuard Home
  hosts: awg
  become: true
  pre_tasks:
    - name: Check AdGuard Home password is set
      ansible.builtin.assert:
        that:
          - vault_adguardhome_pass_hash is defined
          - vault_adguardhome_pass_hash is match('^\$2[aby]\$')
        fail_msg: >-
          vault_adguardhome_pass_hash is not a bcrypt hash. Run `make hash`
          and put the result into inventory/group_vars/all/vault.yml
        quiet: true

    - name: Warn when clients are not pointed at this DNS
      ansible.builtin.debug:
        msg: >-
          awg_local_dns is false: new clients get 1.1.1.1 and will not use
          AdGuard Home. Set it to true and run make vpn to change that.
      when: not (awg_local_dns | default(true) | bool)
  roles:
    - adguardhome
  post_tasks:
    - name: Next step
      ansible.builtin.debug:
        msg: >-
          AdGuard Home: connect to the VPN, open
          http://{{ amneziawg_address | ansible.utils.ipaddr('address') }}:3000
